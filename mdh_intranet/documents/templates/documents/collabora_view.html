{% extends "base.html" %}

{% block title %}Edit: {{ document.title }}{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <!-- Header -->
    <div class="bg-white border-bottom px-3 py-2 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <a href="{% url 'documents:detail' document.pk %}" class="btn btn-sm btn-outline-secondary" aria-label="Back to Document Details" title="Back to Document Details">
                <i class="fas fa-arrow-left"></i>
            </a>
            <strong>{{ document.title }}</strong>
            <span class="badge bg-info text-dark">Collabora Online</span>
        </div>
        <div>
            <!-- Collabora handles saving automatically via WOPI -->
            <span class="text-muted small me-2"><i class="fas fa-save me-1"></i>Auto-saving enabled</span>
        </div>
    </div>

    <!-- Editor Frame -->
    <div style="height: calc(100vh - 110px);">
        <!-- Using modern Collabora endpoint with WOPI protocol -->
        <iframe src="{{ collabora_src }}" width="100%" height="100%" style="border:none;" allowfullscreen title="Collabora Online Document Editor">
        </iframe>
    </div>
</div>
{% endblock %}
