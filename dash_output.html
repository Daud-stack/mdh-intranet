<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MDH Premium Hub</title>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            border-radius: 1.5rem;
            border: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon i {
            font-size: 2.5rem;
            color: white;
        }

        h2 {
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .form-control {
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 0.5rem;
            padding: 0.875rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #5568d3 0%, #65408b 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 0.5rem;
            border: none;
        }

        .divider {
            margin: 1.5rem 0;
            border-top: 1px solid #e9ecef;
        }

        a {
            color: #667eea;
            text-decoration: none;
        }

        a:hover {
            color: #5568d3;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="card">
            <div class="card-body p-5">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-hospital-user"></i>
                    </div>
                    <h2>MDH Premium Hub</h2>
                    <p class="subtitle">Sign in to access your dashboard</p>
                </div>

                

                <form method="post" action="/accounts/login/">
                    <input type="hidden" name="csrfmiddlewaretoken" value="ewKqMLvfGERkHdfBiyohtOBLAm1F3oglLkYI0jqLFQB2mmQqOwBVGtq9488pq4Ee">
                    <input type="hidden" name="next" value="/">

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" class="form-control form-control-lg" id="id_username"
                            name="username" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg"
                            id="id_password" name="password"
                            placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-login btn-primary btn-lg w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>

                    <div class="text-center">
                        <small class="text-muted">
                            <a href="/accounts/password_reset/">Forgot your password?</a>
                        </small>
                    </div>
                </form>

                <div class="divider"></div>

                <div class="text-center">
                    <small class="text-muted">
                        Need access? Contact your system administrator.
                    </small>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <small class="text-white-50">© 2026 MDH Intranet. All rights reserved.</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
